name: songify
description: A juicy, physics-based music aggregator app.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- Animation ---
  flutter_animate: ^4.5.0

  # --- Routing ---
  go_router: ^14.2.7

  # --- State Management ---
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # --- Audio ---
  just_audio: ^0.9.39
  just_audio_background: ^0.0.1-beta.12

  # --- Python Bridge ---
  serious_python: ^0.5.1

  # --- Networking / Spotify ---
  dio: ^5.4.3+1
  cached_network_image: ^3.3.1

  # --- Sliding Panel ---
  sliding_up_panel2: ^2.0.0+2

  # --- Local Persistence ---
  hive_flutter: ^1.1.0

  # --- Models ---
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # --- Utilities ---
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
    - assets/python/
